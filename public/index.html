<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17231c">
  <meta name="description" content="Lokale Magic: The Gathering collectie-, wanted- en deckmanager">
  <title>Magic Collection Manager</title>
  <link rel="stylesheet" href="/styles.css?v=2.3.3">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Hoofdnavigatie">
      <a class="brand" href="#/dashboard" aria-label="Magic Collection Manager">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span><strong>Magic</strong><small>Collection Manager</small></span>
      </a>
      <nav class="main-nav">
        <a href="#/dashboard" data-nav="dashboard"><span aria-hidden="true">⌂</span> Dashboard</a>
        <a href="#/collection" data-nav="collection"><span aria-hidden="true">▦</span> Collectie</a>
        <a href="#/add" data-nav="add" data-write-action><span aria-hidden="true">＋</span> Kaart toevoegen</a>
        <a href="#/decks" data-nav="decks"><span aria-hidden="true">▤</span> Decks</a>
        <a href="#/wanted" data-nav="wanted"><span aria-hidden="true">☆</span> Wanted</a>
        <a href="#/settings" data-nav="settings"><span aria-hidden="true">⚙</span> Onderhoud</a>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <a class="mobile-brand" href="#/dashboard" aria-label="Dashboard"><span class="brand-mark">M</span></a>
        <div class="global-search-wrap">
          <label class="sr-only" for="global-search">Zoek een kaart</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="global-search" type="search" autocomplete="off" placeholder="Controleer direct of je een kaart hebt…">
          <kbd>/</kbd>
          <div id="global-search-results" class="search-popover" hidden></div>
        </div>
        <a class="button primary compact top-add" data-write-action href="#/add"><span aria-hidden="true">＋</span><span>Toevoegen</span></a>
      </header>

      <main id="app" tabindex="-1">
        <div class="page-loading"><span class="spinner"></span><p>Applicatie laden…</p></div>
      </main>
    </div>
  </div>

  <nav class="mobile-nav" aria-label="Mobiele navigatie">
    <a href="#/dashboard" data-nav="dashboard"><span class="mobile-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5v9a1.5 1.5 0 0 1-1.5 1.5h-4.5v-6h-5v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span><small>Home</small></a>
    <a href="#/collection" data-nav="collection"><span class="mobile-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span><small>Collectie</small></a>
    <a href="#/decks" data-nav="decks"><span class="mobile-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="13" height="17" rx="2"/><path d="M8 7h7M8 11h7M8 15h4"/></svg></span><small>Decks</small></a>
    <a href="#/wanted" data-nav="wanted"><span class="mobile-nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></span><small>Wanted</small></a>
  </nav>

  <div id="toast-region-top" class="toast-region toast-region-top" aria-live="polite" aria-atomic="true"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="/js/app.js?v=2.3.3"></script>
</body>
</html>
